<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh" data-style="web" data-theme="light" data-power="off">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c0c0c0">
  <title>桌面 — Maria Pan</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preload" href="bliss.jpg" as="image">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var language = localStorage.getItem('site-lang') === 'en' ? 'en' : 'zh';
      document.documentElement.dataset.lang = language;
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
      if (localStorage.getItem('site-lang-chosen') === '1') document.documentElement.dataset.langChosen = '1';
    } catch (e) { /* 中文默认值支持离线和禁用存储的浏览器。 */ }
  </script>
  <script src="nav.js" defer></script>
  <script src="power-machine.js" defer></script>
</head>
<body class="page-index">
<a class="skip-link" href="#content">跳至内容</a>
<div class="computer-stage">
  <div class="computer">
    <div class="monitor">
      <div class="screen-rim">
        <div class="screen">
          <img class="wallpaper" src="bliss.jpg" alt="" fetchpriority="high" decoding="async">
          <div class="crt-glass" aria-hidden="true"></div>
          <main id="content" class="sr-only">
            <h1>Maria Pan</h1>
            <p class="lang-zh">桌面。请用右下角电源键开机，或用任务栏浏览网站。</p>
            <p class="lang-en">Desktop. Press the power button at the lower right to start, or use the taskbar to browse.</p>
          </main>
          <header id="site-header"></header>
        </div>
      </div>
      <div class="monitor-chin"><span class="monitor-brand">MARIA</span><div class="monitor-hardware"><span class="vents"></span><span class="power-led" aria-hidden="true"></span><button class="power-mark" type="button" data-machine-power aria-label="电源：开机" title="电源" aria-pressed="false">⏻</button></div></div>
    </div>
    <div class="monitor-neck" aria-hidden="true"></div>
    <div class="monitor-foot" aria-hidden="true"></div>
  </div>
</div>
</body>
</html>
